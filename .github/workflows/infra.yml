name: Infrastructure checks

on:
  push:
    branches: [main]
    paths: ["deploy/**", "infra/**", "scripts/**", "Makefile", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["deploy/**", "infra/**", "scripts/**", "Makefile"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-and-policies:
    name: Helm chart and Kyverno policies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install tools
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          curl -fsSL https://github.com/kyverno/kyverno/releases/download/v1.13.4/kyverno-cli_v1.13.4_linux_x86_64.tar.gz | tar xz kyverno
          sudo mv kubeconform kyverno /usr/local/bin/

      - name: helm lint
        run: |
          helm lint deploy/helm/drydock
          helm lint deploy/helm/drydock -f deploy/helm/drydock/values-kind.yaml

      - name: Render the chart
        run: |
          mkdir -p out
          helm template drydock deploy/helm/drydock -f deploy/helm/drydock/values-kind.yaml > out/kind.yaml
          helm template drydock deploy/helm/drydock \
            --set ingress.enabled=true --set monitoring.enabled=true \
            --set image.tag=1.0.0 > out/full.yaml

      - name: kubeconform (core resources)
        run: |
          kubeconform -strict -summary -ignore-missing-schemas out/kind.yaml
          kubeconform -strict -summary -ignore-missing-schemas out/full.yaml

      - name: Kyverno policy tests
        run: |
          if ! kyverno test deploy/kyverno/tests > kyverno-test.log 2>&1; then
            msg=$(head -c 3500 kyverno-test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=kyverno test::${msg}"
            exit 1
          fi

      - name: Rendered chart must pass the admission policies
        run: |
          for f in out/kind.yaml out/full.yaml; do
            kyverno apply deploy/kyverno/policies/disallow-latest-tag.yaml \
              deploy/kyverno/policies/require-non-root.yaml \
              deploy/kyverno/policies/require-hardened-container.yaml \
              deploy/kyverno/policies/require-resource-limits.yaml \
              --resource "$f"
          done

      - name: Trivy config scan of the chart
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: deploy/helm/drydock
          severity: HIGH,CRITICAL
          exit-code: "1"

  scripts:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          format: json
          output: ${{ github.workspace }}/trivy-tf.json
          exit-code: "0"
      - name: Fail on findings
        run: |
          n=$(jq '[.Results[]?.Misconfigurations[]?]|length' "$GITHUB_WORKSPACE/trivy-tf.json")
          if [ "$n" -gt 0 ]; then
            msg=$(jq -r '.Results[]?|.Target as $t|.Misconfigurations[]?|"\($t) \(.ID) \(.Severity) \(.Title) :: \(.CauseMetadata.StartLine // "?")"' "$GITHUB_WORKSPACE/trivy-tf.json" | head -c 3000 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=trivy terraform::${msg}"
            exit 1
          fi
