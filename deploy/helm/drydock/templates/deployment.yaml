apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "drydock.fullname" . }}
  labels:
    {{- include "drydock.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "drydock.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "drydock.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "drydock.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: drydock
          image: {{ include "drydock.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "drydock.secretName" . }}
                  key: database-url
            - name: DRYDOCK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "drydock.secretName" . }}
                  key: api-key
            - name: DRYDOCK_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: DRYDOCK_RATE_LIMIT_PER_MINUTE
              value: {{ .Values.config.rateLimitPerMinute | quote }}
            - name: DRYDOCK_MAX_UPLOAD_BYTES
              value: {{ .Values.config.maxUploadBytes | int64 | toString | quote }}
            - name: DRYDOCK_MAX_PACKAGES
              value: {{ .Values.config.maxPackages | quote }}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only. Uploads are spooled to /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
