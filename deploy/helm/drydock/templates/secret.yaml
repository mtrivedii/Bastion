{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- /* Generated on first install, then reused: read the existing Secret so an upgrade does not rotate the password under a running database. */ -}}
{{- $name := include "drydock.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $apiKey := randAlphaNum 40 -}}
{{- $dbPassword := randAlphaNum 32 -}}
{{- if and $existing $existing.data -}}
{{- if hasKey $existing.data "api-key" }}{{ $apiKey = index $existing.data "api-key" | b64dec }}{{ end -}}
{{- if hasKey $existing.data "postgres-password" }}{{ $dbPassword = index $existing.data "postgres-password" | b64dec }}{{ end -}}
{{- end -}}
{{- if not .Values.postgres.enabled -}}
{{- fail "secrets.create needs postgres.enabled. For an external database, create your own Secret and set secrets.existingSecret." -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "drydock.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ $apiKey | b64enc | quote }}
  postgres-password: {{ $dbPassword | b64enc | quote }}
  database-url: {{ printf "postgresql+asyncpg://drydock:%s@%s:5432/drydock" $dbPassword (include "drydock.postgresName" .) | b64enc | quote }}
{{- end }}
