apiVersion: v1
kind: Service
metadata:
  name: {{ include "drydock.fullname" . }}
  labels:
    {{- include "drydock.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "drydock.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
