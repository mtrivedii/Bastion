# Image. Set a digest for anything that is not a local test. A digest wins over a tag.
image:
  repository: ghcr.io/mtrivedii/bastion
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# More than one replica needs a real database (postgres below or your own).
# Scans run inside the pod that received the request, so keep this at 1 unless
# you have thought about that.
replicaCount: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}   # for example eks.amazonaws.com/role-arn when using IRSA

# Application settings. See app/config.py.
config:
  logLevel: INFO
  rateLimitPerMinute: 60
  maxUploadBytes: 5000000
  maxPackages: 20000

# Secrets. By default the chart generates an API key and a database password on
# first install and keeps them on upgrade (it reads the existing Secret).
# To bring your own, create a Secret with the keys `api-key` and `database-url`
# and set existingSecret to its name.
secrets:
  create: true
  existingSecret: ""

# In-cluster Postgres for development and small setups. For anything you care
# about, point existingSecret's database-url at a managed database instead.
postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 1Gi
  storageClassName: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: drydock.example.com
  tls: []   # [{secretName: drydock-tls, hosts: [drydock.example.com]}]

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {cpu: 500m, memory: 256Mi}

# The image already runs as uid 1000. These make the pod spec say so, so a
# policy engine (Kyverno) can verify it without looking inside the image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Network policies. With these on, the app accepts traffic only from the listed
# namespaces and can only reach DNS, its database and HTTPS (OSV.dev) on the
# public internet. Needs a CNI that enforces NetworkPolicy (Calico, Cilium, ...).
networkPolicy:
  enabled: true
  # Namespaces allowed to call the API, matched on the kubernetes.io/metadata.name label.
  ingressNamespaces:
    - ingress-nginx
    - monitoring

# Metrics scraping and alerts. Needs the Prometheus Operator CRDs
# (installed by kube-prometheus-stack).
monitoring:
  enabled: false
  interval: 60s
  rules:
    # Alert when a CRITICAL finding has been open this long.
    criticalOpenFor: 1h
    # Alert when no scan has completed for this many seconds.
    scanStaleSeconds: 604800
