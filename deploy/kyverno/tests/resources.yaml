apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: drydock
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
  - name: app
    image: ghcr.io/mtrivedii/bastion:abc1234
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
---
